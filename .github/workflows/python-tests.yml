name: Python regression tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn sqlalchemy pytest
      - name: Run temporal regression tests
        run: python -m pytest -q test/
